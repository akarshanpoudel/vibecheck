<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — VibeCheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <div class="wrap">
    <span class="overline">404</span>

    </footer>
